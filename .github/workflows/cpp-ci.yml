name: C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check format
        run: |
          clang-format --version
          cmake \
            -DCLANG_FORMAT_EXECUTABLE=clang-format \
            -DCLAVIS_SOURCE_DIR="$PWD" \
            -DCLAVIS_FORMAT_CHECK=ON \
            -P cmake/RunClangFormat.cmake

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtest-dev ninja-build

      - name: Show tool versions
        run: |
          cmake --version
          g++ --version

      - name: Build and test
        run: cmake --workflow --preset ci
